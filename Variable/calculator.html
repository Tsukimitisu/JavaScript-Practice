<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h1>Calculator</h1>
    <output class="js-result" aria-live="polite">0</output>

    <p>
        <button type="button" onclick="updateCalculation('7')">7</button>
        <button type="button" onclick="updateCalculation('8')">8</button>
        <button type="button" onclick="updateCalculation('9')">9</button>
        <button type="button" onclick="updateCalculation(' / ')">/</button>
    </p>
    <p>
        <button type="button" onclick="updateCalculation('4')">4</button>
        <button type="button" onclick="updateCalculation('5')">5</button>
        <button type="button" onclick="updateCalculation('6')">6</button>
        <button type="button" onclick="updateCalculation(' * ')">*</button>
    </p>
    <p>
        <button type="button" onclick="updateCalculation('1')">1</button>
        <button type="button" onclick="updateCalculation('2')">2</button>
        <button type="button" onclick="updateCalculation('3')">3</button>
        <button type="button" onclick="updateCalculation(' - ')">-</button>
    </p>
    <p>
        <button type="button" onclick="updateCalculation('0')">0</button>
        <button type="button" onclick="updateCalculation('.')">.</button>
        <button type="button" onclick="calculateResult()">=</button>
        <button type="button" onclick="updateCalculation(' + ')">+</button>
    </p>
    <button type="button" onclick="removeLastEntry()">Backspace</button>
    <button type="button" onclick="clearCalculation()">Clear</button>

    <script>
        let calculation = '';

        function displayCalculation(value = calculation || '0') {
            document.querySelector('.js-result').textContent = value;
        }

        function updateCalculation(value) {
            calculation += value;
            displayCalculation();
        }

        function calculateResult() {
            if (!calculation) {
                return;
            }

            try {
                calculation = String(eval(calculation));
                displayCalculation();
            } catch {
                calculation = '';
                displayCalculation('Invalid calculation');
            }
        }

        function clearCalculation() {
            calculation = '';
            displayCalculation();
        }

        function removeLastEntry() {
            calculation = calculation.trimEnd().slice(0, -1).trimEnd();
            displayCalculation();
        }

        document.addEventListener('keydown', (event) => {
            if (event.target instanceof HTMLButtonElement) {
                return;
            }

            if (/^[0-9.]$/.test(event.key)) {
                updateCalculation(event.key);
            } else if (/^[+\-*/]$/.test(event.key)) {
                updateCalculation(` ${event.key} `);
            } else if (event.key === 'Enter' || event.key === '=') {
                event.preventDefault();
                calculateResult();
            } else if (event.key === 'Backspace') {
                removeLastEntry();
            } else if (event.key === 'Escape') {
                clearCalculation();
            } else {
                return;
            }

            event.preventDefault();
        });
    </script>
</body>
</html>
