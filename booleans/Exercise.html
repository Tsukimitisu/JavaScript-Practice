<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>
<body>
    <p>Cart Quantity</p>
    <p class="js-cart-status" role="status" aria-live="polite">Cart Quantity: 0 / 10</p>
    <button type="button" onclick="showQuantity()">Show Quantity</button>
    <button type="button" onclick="addToCart(1)">Add to Cart</button>
    <button type="button" onclick="addToCart(2)">+2</button>
    <button type="button" onclick="addToCart(3)">+3</button>
    <button type="button" onclick="addToCart(4)">+4</button>
    <button type="button" onclick="removeFromCart(1)">-1</button>
    <button type="button" onclick="resetCart()">Reset Cart</button>
</body>
<script>
    const maxCartQuantity = 10;
    const storageKey = 'boolean-cart-quantity';
    const savedQuantity = Number.parseInt(localStorage.getItem(storageKey), 10);
    let cartQuantity = Number.isInteger(savedQuantity) &&
        savedQuantity >= 0 && savedQuantity <= maxCartQuantity
        ? savedQuantity
        : 0;
    const cartStatusElement = document.querySelector('.js-cart-status');

    showQuantity();

    function showQuantity(message = '') {
        cartStatusElement.textContent = message ||
            `Cart Quantity: ${cartQuantity} / ${maxCartQuantity}`;
        console.log(`Cart Quantity: ${cartQuantity} / ${maxCartQuantity}`);
    }

    function addToCart(amount) {
        if (cartQuantity >= maxCartQuantity) {
            showQuantity('The cart is already full.');
            return;
        }

        if (cartQuantity + amount > maxCartQuantity) {
            cartQuantity = maxCartQuantity;
        } else {
            cartQuantity += amount;
        }

        localStorage.setItem(storageKey, String(cartQuantity));
        showQuantity();
    }

    function removeFromCart(amount) {
        if (cartQuantity === 0) {
            showQuantity('The cart is already empty.');
            return;
        }

        cartQuantity -= amount;

        if (cartQuantity < 0) {
            cartQuantity = 0;
        }

        localStorage.setItem(storageKey, String(cartQuantity));
        showQuantity();
    }

    function resetCart() {
        cartQuantity = 0;
        localStorage.removeItem(storageKey);
        console.log('Cart Was Reset');
        showQuantity('Cart reset. Cart Quantity: 0 / 10');
    }



</script>
</html>
