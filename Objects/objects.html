<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Rock Paper Scissors</title>
</head>
<body>
    <h1>Object Rock Paper Scissors</h1>
    <button type="button" class="js-move-button" data-move="Rock" aria-keyshortcuts="1">Rock</button>
    <button type="button" class="js-move-button" data-move="Paper" aria-keyshortcuts="2">Paper</button>
    <button type="button" class="js-move-button" data-move="Scissors" aria-keyshortcuts="3">Scissors</button>
    <p>Keyboard shortcuts: 1 for rock, 2 for paper, 3 for scissors, and R to reset.</p>
    <p class="js-result" role="status" aria-live="polite">Choose a move to start.</p>
    <p class="js-score"></p>
    <button type="button" class="js-reset-button" aria-keyshortcuts="R">Reset Score</button>

    <script>
        const storageKey = 'object-rps-score';
        const legacyStorageKey = 'score';
        let score = loadScore();

        updateScore();

        document.querySelectorAll('.js-move-button').forEach((button) => {
            button.addEventListener('click', () => playGame(button.dataset.move));
        });

        document.querySelector('.js-reset-button').addEventListener('click', resetScore);

        document.addEventListener('keydown', (event) => {
            if (event.repeat) {
                return;
            }

            const keyboardMoves = {
                1: 'Rock',
                2: 'Paper',
                3: 'Scissors'
            };
            const move = keyboardMoves[event.key];

            if (move) {
                playGame(move);
            } else if (event.key.toLowerCase() === 'r') {
                resetScore();
            } else {
                return;
            }

            event.preventDefault();
        });

        function loadScore() {
            try {
                const savedValue = localStorage.getItem(storageKey) ??
                    localStorage.getItem(legacyStorageKey);
                const savedScore = JSON.parse(savedValue);
                const values = [savedScore?.wins, savedScore?.losses, savedScore?.tie];

                if (values.every((value) => Number.isInteger(value) && value >= 0)) {
                    return savedScore;
                }
            } catch {
                // Ignore invalid saved data and start with a clean score.
            }

            return { wins: 0, losses: 0, tie: 0 };
        }

        function getComputersMove() {
            const randomNumber = Math.random();

            if (randomNumber < 1 / 3) {
                return 'Scissors';
            }

            if (randomNumber < 2 / 3) {
                return 'Paper';
            }

            return 'Rock';
        }

        function playGame(playersMove) {
            const computersMove = getComputersMove();
            let result = '';

            if (playersMove === computersMove) {
                result = 'Tie';
            } else if (
                (playersMove === 'Rock' && computersMove === 'Paper') ||
                (playersMove === 'Scissors' && computersMove === 'Rock') ||
                (playersMove === 'Paper' && computersMove === 'Scissors')
            ) {
                result = 'You Lose!';
            } else {
                result = 'You Win!';
            }

            if (result === 'You Win!') {
                score.wins += 1;
            } else if (result === 'You Lose!') {
                score.losses += 1;
            } else {
                score.tie += 1;
            }

            localStorage.setItem(storageKey, JSON.stringify(score));
            localStorage.removeItem(legacyStorageKey);
            document.querySelector('.js-result').textContent =
                `You chose ${playersMove}. The computer chose ${computersMove}. ${result}`;
            updateScore();
        }

        function updateScore() {
            document.querySelector('.js-score').textContent =
                `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.tie}`;
        }

        function resetScore() {
            score = { wins: 0, losses: 0, tie: 0 };
            localStorage.removeItem(storageKey);
            localStorage.removeItem(legacyStorageKey);
            document.querySelector('.js-result').textContent = 'Choose a move to start.';
            updateScore();
        }
    </script>
</body>
</html>
