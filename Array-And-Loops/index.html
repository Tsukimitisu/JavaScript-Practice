<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="todo-list.css">
</head>
<body>
    <main>
        <h1>Todo List</h1>
        <form class="js-todo-form">
            <label for="todo-name">Todo name</label>
            <input type="text" id="todo-name" placeholder="Todo name" class="js-input" maxlength="100" aria-describedby="todo-name-count" required>
            <label for="todo-due-date">Due date</label>
            <input type="date" id="todo-due-date" class="js-due-date">
            <label for="todo-priority">Priority</label>
            <select id="todo-priority" class="js-priority">
                <option value="normal">Normal</option>
                <option value="high">High</option>
                <option value="low">Low</option>
            </select>
            <span id="todo-name-count" class="js-todo-count">0 / 100</span>
            <button type="submit">Add</button>
        </form>
        <p class="js-todo-message" role="status" aria-live="polite"></p>
        <button type="button" class="js-undo-remove" hidden>Undo remove</button>
        <p class="js-todo-summary" aria-live="polite">0 tasks remaining</p>
        <section class="todo-controls" aria-label="Task controls">
            <label for="todo-filter">Show</label>
            <select id="todo-filter" class="js-todo-filter">
                <option value="all">All tasks</option>
                <option value="active">Active tasks</option>
                <option value="completed">Completed tasks</option>
                <option value="today">Due today</option>
                <option value="overdue">Overdue tasks</option>
            </select>
            <label for="todo-search">Search</label>
            <input type="search" id="todo-search" class="js-todo-search" placeholder="Search tasks" autocomplete="off">
            <button type="button" class="js-clear-search">Clear search</button>
            <label for="todo-sort">Sort</label>
            <select id="todo-sort" class="js-todo-sort">
                <option value="manual">Manual</option>
                <option value="due-date">Due date</option>
                <option value="priority">Priority</option>
            </select>
            <button type="button" class="js-toggle-all">Mark all complete</button>
            <button type="button" class="js-clear-completed">Clear completed</button>
        </section>
        <p class="todo-shortcuts"><strong>Keyboard:</strong> Press <kbd>/</kbd> to search and <kbd>Escape</kbd> to clear search.</p>
        <ul class="js-todo-list" aria-live="polite"></ul>
    </main>
    <script src="todo-list.js"></script>
</body>
</html>
