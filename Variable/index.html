<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>
<body>
    <h1>Cart Quantity</h1>
    <p class="js-cart-status" role="status" aria-live="polite"></p>
    <button type="button" class="js-show-cart">Show Quantity</button>
    <button type="button" data-cart-amount="1">Add to Cart</button>
    <button type="button" data-cart-amount="2">+2</button>
    <button type="button" data-cart-amount="3">+3</button>
    <button type="button" data-cart-amount="-1">Remove from Cart</button>
    <button type="button" class="js-reset-cart">Reset Cart</button>
</body>
<script>
    const maxCartQuantity = 10;
    const storageKey = 'cart-quantity';
    const savedQuantity = Number.parseInt(localStorage.getItem(storageKey), 10);
    let cartQuantity = Number.isInteger(savedQuantity) &&
        savedQuantity >= 0 && savedQuantity <= maxCartQuantity
        ? savedQuantity
        : 0;

    showQuantity();

    function showQuantity(message = '') {
        const status = document.querySelector('.js-cart-status');
        status.textContent = message || `Cart Quantity: ${cartQuantity} / ${maxCartQuantity}`;
    }

    function addToCart(amount) {
        if (cartQuantity + amount > maxCartQuantity) {
            showQuantity(`The cart can hold at most ${maxCartQuantity} items.`);
            return;
        }

        cartQuantity += amount;
        localStorage.setItem(storageKey, String(cartQuantity));
        showQuantity();
    }

    function removeFromCart(amount) {
        if (cartQuantity - amount < 0) {
            showQuantity('The cart is already empty.');
            return;
        }

        cartQuantity -= amount;
        localStorage.setItem(storageKey, String(cartQuantity));
        showQuantity();
    }

    function resetCart() {
        cartQuantity = 0;
        localStorage.removeItem(storageKey);
        showQuantity(`Cart reset. Cart Quantity: 0 / ${maxCartQuantity}`);
    }

    document.querySelector('.js-show-cart').addEventListener('click', () => {
        showQuantity();
    });

    document.querySelectorAll('[data-cart-amount]').forEach((button) => {
        button.addEventListener('click', () => {
            const amount = Number(button.dataset.cartAmount);

            if (amount > 0) {
                addToCart(amount);
            } else {
                removeFromCart(Math.abs(amount));
            }
        });
    });

    document.querySelector('.js-reset-cart').addEventListener('click', resetCart);
</script>
</html>
