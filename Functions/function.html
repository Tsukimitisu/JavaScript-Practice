<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <button type="button" onclick="
         playGame('Rock');
    ">Rock</button>
    <button type="button" onclick="
        playGame('Paper');
    ">Paper</button>
    <button type="button" onclick="
       playGame('Scissors');
    ">Scissors</button>
    <p class="js-result" role="status" aria-live="polite">Choose a move to start.</p>
    <p class="js-score">Wins: 0, Losses: 0, Ties: 0</p>
    <button type="button" onclick="resetScore()">Reset Score</button>
</body>

<script>
    let score = { wins: 0, losses: 0, ties: 0 };

    function getComputersMove(){
        const randomNumber = Math.random();
       
        if(randomNumber >= 0 && randomNumber <1/3){
            return 'Scissors';
        }else if (randomNumber >= 1/3 && randomNumber < 2/3){
            return 'Paper';
        }else{  
            return 'Rock';
        }
    }

    function playGame(playersMove){
        const computersMove = getComputersMove();
        let result = '';
        if(playersMove === computersMove){
            result = 'Tie';
        }else if (
            (playersMove === 'Rock' && computersMove === 'Paper')||
            (playersMove === 'Scissors' && computersMove === 'Rock')||
            (playersMove === 'Paper' && computersMove === 'Scissors')
        ){
            result = 'You Lose!';
        }else{
            result = 'You Win!';
        }

        if (result === 'You Win!') {
            score.wins += 1;
        } else if (result === 'You Lose!') {
            score.losses += 1;
        } else {
            score.ties += 1;
        }

        document.querySelector('.js-result').textContent =
            `You chose ${playersMove}. Computer chose ${computersMove}. ${result}`;
        updateScore();
    }

    function updateScore() {
        document.querySelector('.js-score').textContent =
            `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }

    function resetScore() {
        score = { wins: 0, losses: 0, ties: 0 };
        document.querySelector('.js-result').textContent = 'Choose a move to start.';
        updateScore();
    }



</script>
</html>
