<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Manipulation Exercise</title>
</head>
<body>
    <button>9a</button>
    <button class="js-btn">9b</button>
    <br>
    <br>
    <hr>
    <br>
    <button type="button" class="js-choice-btn" data-choice="heads">Heads</button>
    <button type="button" class="js-choice-btn" data-choice="tails">Tails</button>
    <p class="js-display" aria-live="polite"></p>
    <br>
    <hr>

    <form class="js-name-form">
        <label for="name-input">Your name</label>
        <input id="name-input" type="text" name="name" class="js-NameInput" placeholder="Enter your name" required>
        <button type="submit">Submit</button>
    </form>
    <p class="js-NameDisplay" aria-live="polite"></p>

    <hr>
    <label for="live-input">Live preview</label>
    <input id="live-input" type="text" class="js-keyUp">
    <p class="js-displaykeyUp" aria-live="polite"></p>
</body>

<script>
    console.log(document.querySelector('button'))
    document.querySelector('.js-btn').innerText =  '9B Done'

    const display = document.querySelector('.js-display')
    document.querySelectorAll('.js-choice-btn').forEach((button) => {
        button.addEventListener('click', () => {
            const choice = button.dataset.choice;
            display.textContent = `You chose: ${choice === 'heads' ? 'Heads' : 'Tails'}`;
        });
    });

   
    function displayNames() {
        const displayName = document.querySelector('.js-NameDisplay')
        const nameInput = document.querySelector('.js-NameInput')
        const name = nameInput.value.trim()

        displayName.textContent = name
            ? `Your name is: ${name}`
            : 'Please enter your name.'
    }

    document.querySelector('.js-name-form').addEventListener('submit', (event) => {
        event.preventDefault();
        displayNames();
    });

    document.querySelector('.js-keyUp').addEventListener('input', () => {
        const getName = document.querySelector('.js-keyUp')
        const keyUpDisplay = document.querySelector('.js-displaykeyUp')
        keyUpDisplay.textContent = getName.value
    });

    

</script>
</html>
