<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basics</title>
</head>
<body>
    <main>
        <h1>JavaScript Basics</h1>
        <p>These results are calculated with variables, arithmetic, and template strings.</p>
        <ul class="js-results" aria-live="polite"></ul>
    </main>

    <script>
        const shirtPrice = 10;
        const socksPrice = 8;
        const platesPrice = 20;
        const shoppingTotal = shirtPrice + socksPrice + platesPrice;

        const startingBalance = 100;
        const lunchCost = 20;
        const dinnerCost = 50;
        const earnings = 200;
        const totalCost = lunchCost + dinnerCost;
        const endingBalance = startingBalance - totalCost + earnings;

        const exerciseResults = [
            'Good morning, James Andrei Revilla!',
            `10 + 5 = ${10 + 5}`,
            `20 - 5 = ${20 - 5}`,
            `2 + 2 - 5 = ${2 + 2 - 5}`,
            `Shopping total: $${shoppingTotal}`,
            `Starting with $${startingBalance}, spending $${totalCost}, and earning $${earnings} leaves $${endingBalance}.`
        ];

        const resultsElement = document.querySelector('.js-results');
        exerciseResults.forEach((result) => {
            const item = document.createElement('li');
            item.textContent = result;
            resultsElement.append(item);
        });
    </script>
</body>
</html>
