<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
   <h1>Rock Paper Scissors</h1>
    <button type="button" onclick="
         playGame('Rock');
    ">Rock</button>
    <button type="button" onclick="
        playGame('Paper');
    ">Paper</button>
    <button type="button" onclick="
       playGame('Scissors');
    ">Scissors</button>
    <p class="js-result" role="status"></p>
    <p class="js-moves" aria-live="polite"></p>
    <p class="js-score"></p>

    <button type="button" onclick="resetScore()">Reset Score</button>
</body>

<script>
    const storageKey = 'dom-rps-score';
    let score = JSON.parse(localStorage.getItem(storageKey)) || {
            wins: 0,
            losses: 0,
            tie: 0
        };

    updateScoreElement();
    function getComputersMove(){
        const randomNumber = Math.random();
       
        if(randomNumber >= 0 && randomNumber <1/3){
            return 'Scissors';  
        }else if (randomNumber >= 1/3 && randomNumber < 2/3){
            return 'Paper';        
        }else{  
            return 'Rock';
        }
    }

    function playGame(playersMove){
        const computersMove = getComputersMove();
        let result = '';
        if(playersMove === computersMove){
            result = 'Tie';
        }else if (
            (playersMove === 'Rock' && computersMove === 'Paper')||
            (playersMove === 'Scissors' && computersMove === 'Rock')||
            (playersMove === 'Paper' && computersMove === 'Scissors')
        ){
            result = 'You Lose!';
        }else{
            result = 'You Win!';
        }

        if(result === 'You Win!'){
            score.wins += 1;
        }else if(result === 'You Lose!'){
            score.losses += 1;
        }else if(result === 'Tie'){
            score.tie += 1;
        }

        updateScoreElement();

        localStorage.setItem(storageKey, JSON.stringify(score));
        document.querySelector('.js-moves').textContent =
            `You chose ${playersMove}. The computer chose ${computersMove}.`;
        document.querySelector('.js-result').textContent = result;

  
    }

    function updateScoreElement(){
         document.querySelector('.js-score').textContent =
            `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.tie}`;
    }

    function resetScore() {
        score.wins = 0;
        score.losses = 0;
        score.tie = 0;
        localStorage.removeItem(storageKey);
        updateScoreElement();
        document.querySelector('.js-result').textContent = '';
        document.querySelector('.js-moves').textContent = '';
    }

    
</script>
</html>
