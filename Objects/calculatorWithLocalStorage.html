<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage Calculator</title>
  </head>
  <body>
    <p class="js-result" aria-live="polite">0</p>
    <p>
      <button onclick="
        updateCalculation('1');
      ">1</button>

      <button onclick="
        updateCalculation('2');
      ">2</button>

      <button onclick="
        updateCalculation('3');
      ">3</button>

      <button onclick="
        updateCalculation(' + ');
      ">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      ">4</button>

      <button onclick="
        updateCalculation('5');
      ">5</button>

      <button onclick="
        updateCalculation('6');
      ">6</button>

      <button onclick="
        updateCalculation(' - ');
      ">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      ">7</button>

      <button onclick="
        updateCalculation('8');
      ">8</button>

      <button onclick="
        updateCalculation('9');
      ">9</button>

      <button onclick="
        updateCalculation(' * ');
      ">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      ">0</button>

      <button onclick="
        updateCalculation('.');
      ">.</button>

      <button onclick="
        calculateResult();
      ">=</button>

      <button onclick="
        updateCalculation(' / ');
      ">/</button>
    </p>

    <p>
      <button onclick="removeLastEntry();">Backspace</button>
      <button onclick="
        clearCalculation();
      ">Clear</button>
    </p>

    <script>
      const storageKey = 'object-calculator-value';
      let calculation = localStorage.getItem(storageKey) || '';

      displayCalculation();

      function updateCalculation(value) {
        calculation += value;
        saveAndDisplayCalculation();
      }

      function calculateResult() {
        if (!calculation) {
          return;
        }

        try {
          calculation = String(eval(calculation));
          saveAndDisplayCalculation();
        } catch {
          calculation = '';
          localStorage.removeItem(storageKey);
          displayCalculation('Invalid calculation');
        }
      }

      function clearCalculation() {
        calculation = '';
        localStorage.removeItem(storageKey);
        displayCalculation();
      }

      function removeLastEntry() {
        calculation = calculation.trimEnd().slice(0, -1).trimEnd();
        saveAndDisplayCalculation();
      }

      function saveAndDisplayCalculation() {
        if (calculation) {
          localStorage.setItem(storageKey, calculation);
        } else {
          localStorage.removeItem(storageKey);
        }
        displayCalculation();
      }

      function displayCalculation(value = calculation || '0') {
        document.querySelector('.js-result').textContent = value;
      }

      document.addEventListener('keydown', (event) => {
        if (event.target instanceof HTMLButtonElement) {
          return;
        }

        if (/^[0-9.]$/.test(event.key)) {
          updateCalculation(event.key);
        } else if (/^[+\-*/]$/.test(event.key)) {
          updateCalculation(` ${event.key} `);
        } else if (event.key === 'Enter' || event.key === '=') {
          calculateResult();
        } else if (event.key === 'Backspace') {
          removeLastEntry();
        } else if (event.key === 'Escape') {
          clearCalculation();
        } else {
          return;
        }

        event.preventDefault();
      });
    </script>
  </body>
</html>
