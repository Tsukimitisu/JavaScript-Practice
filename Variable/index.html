<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>
<body>
    <h1>Cart Quantity</h1>
    <p class="js-cart-status" role="status" aria-live="polite"></p>
    <button type="button" onclick="showQuantity()">Show Quantity</button>
    <button type="button" onclick="addToCart(1)">Add to Cart</button>
    <button type="button" onclick="addToCart(2)">+2</button>
    <button type="button" onclick="addToCart(3)">+3</button>
    <button type="button" onclick="resetCart()">Reset Cart</button>
</body>
<script>
    const maxCartQuantity = 10;
    const storageKey = 'cart-quantity';
    const savedQuantity = Number.parseInt(localStorage.getItem(storageKey), 10);
    let cartQuantity = Number.isInteger(savedQuantity) &&
        savedQuantity >= 0 && savedQuantity <= maxCartQuantity
        ? savedQuantity
        : 0;

    showQuantity();

    function showQuantity(message = '') {
        const status = document.querySelector('.js-cart-status');
        status.textContent = message || `Cart Quantity: ${cartQuantity} / ${maxCartQuantity}`;
    }

    function addToCart(amount) {
        if (cartQuantity + amount > maxCartQuantity) {
            showQuantity(`The cart can hold at most ${maxCartQuantity} items.`);
            return;
        }

        cartQuantity += amount;
        localStorage.setItem(storageKey, String(cartQuantity));
        showQuantity();
    }

    function resetCart() {
        cartQuantity = 0;
        localStorage.removeItem(storageKey);
        showQuantity(`Cart reset. Cart Quantity: 0 / ${maxCartQuantity}`);
    }
</script>
</html>
