<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <p>
      <button onclick="
        updateCalculation('1');
      ">1</button>

      <button onclick="
        updateCalculation('2');
      ">2</button>

      <button onclick="
        updateCalculation('3');
      ">3</button>

      <button onclick="
        updateCalculation(' + ');
      ">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      ">4</button>

      <button onclick="
        updateCalculation('5');
      ">5</button>

      <button onclick="
        updateCalculation('6');
      ">6</button>

      <button onclick="
        updateCalculation(' - ');
      ">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      ">7</button>

      <button onclick="
        updateCalculation('8');
      ">8</button>

      <button onclick="
        updateCalculation('9');
      ">9</button>

      <button onclick="
        updateCalculation(' * ');
      ">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      ">0</button>

      <button onclick="
        updateCalculation('.');
      ">.</button>

      <button onclick="
        // Note: eval() takes a string and runs it as code.
        // Avoid using eval() in real world projects since
        // it can potentially be given harmful code to run.
        // Only use eval() for learning purposes.
        calculation = eval(calculation);
        console.log(calculation);
      ">=</button>

      <button onclick="
        updateCalculation(' / ');
      ">/</button>
    </p>

    <p>
      <button onclick="
        calculation = '';
        console.log(calculation);
      ">Clear</button>
    </p>
 

</body>
<script>
    function greet(){
        console.log('Hello There!');
    }
    greet();

    function greetUser(name){
        console.log(`Hello There! ${name}`)
    }
    greetUser('James');
    function convertToFahrenheit(celsius){
        const fahrenheit = (celsius * 9 / 5) + 32;
        return `${fahrenheit}F`;
    }

    console.log(convertToFahrenheit(25));
 
    function convertToCelsius(fahrenheit){
        const celsius = (fahrenheit - 32) * 5 / 9;
        return `${celsius}C`;
    }

    console.log(convertToCelsius(86));

    function convertTemperature(degrees, unit){
        if(unit === 'C'){
            return convertToFahrenheit(degrees);
        }else if (unit === 'F'){
            return convertToCelsius(degrees);
        }

        return 'Please choose C for Celsius or F for Fahrenheit.';
    }

    console.log(convertTemperature(25, 'C'));

    function convertLength(length, from, to){
        const validUnits = ['miles', 'km', 'ft'];

        if (!validUnits.includes(from)) {
            return `Invalid unit: ${from}`;
        }

        if (!validUnits.includes(to)) {
            return `Invalid unit: ${to}`;
        }

        if (from === to) {
            return `${length} ${to}`;
        }

        const lengthInKm = from === 'km'
            ? length
            : from === 'miles'
                ? length * 1.6
                : length / 3281;

        const result = to === 'km'
            ? lengthInKm
            : to === 'miles'
                ? lengthInKm / 1.6
                : lengthInKm * 3281;

        return `${result} ${to}`;
    }
    console.log(convertLength(50, 'miles', 'km'));
    console.log(convertLength(32, 'km', 'miles'));
    console.log(convertLength(5, 'miles', 'ft'));
    console.log(convertLength(5, 'lbs', 'lbs'));

  let calculation = '';
   function updateCalculation(value) {
        calculation += value;
        console.log(calculation);
      }

</script>
</html>
