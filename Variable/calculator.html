<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h1>Calculator</h1>
    <output class="js-result" aria-live="polite">0</output>

    <p>
        <button type="button" data-calculator-value="7">7</button>
        <button type="button" data-calculator-value="8">8</button>
        <button type="button" data-calculator-value="9">9</button>
        <button type="button" data-calculator-value=" / ">/</button>
    </p>
    <p>
        <button type="button" data-calculator-value="4">4</button>
        <button type="button" data-calculator-value="5">5</button>
        <button type="button" data-calculator-value="6">6</button>
        <button type="button" data-calculator-value=" * ">*</button>
    </p>
    <p>
        <button type="button" data-calculator-value="1">1</button>
        <button type="button" data-calculator-value="2">2</button>
        <button type="button" data-calculator-value="3">3</button>
        <button type="button" data-calculator-value=" - ">-</button>
    </p>
    <p>
        <button type="button" data-calculator-value="0">0</button>
        <button type="button" data-calculator-value=".">.</button>
        <button type="button" class="js-calculate">=</button>
        <button type="button" data-calculator-value=" + ">+</button>
    </p>
    <button type="button" class="js-backspace">Backspace</button>
    <button type="button" class="js-clear">Clear</button>

    <script src="../shared/calculator-math.js"></script>
    <script>
        let calculation = '';

        function displayCalculation(value = calculation || '0') {
            document.querySelector('.js-result').textContent = value;
        }

        function updateCalculation(value) {
            calculation += value;
            displayCalculation();
        }

        function calculateResult() {
            if (!calculation) {
                return;
            }

            try {
                calculation = String(CalculatorMath.evaluate(calculation));
                displayCalculation();
            } catch (error) {
                calculation = '';
                displayCalculation(error.message);
            }
        }

        function clearCalculation() {
            calculation = '';
            displayCalculation();
        }

        function removeLastEntry() {
            calculation = calculation.trimEnd().slice(0, -1).trimEnd();
            displayCalculation();
        }

        document.querySelectorAll('[data-calculator-value]').forEach((button) => {
            button.addEventListener('click', () => updateCalculation(button.dataset.calculatorValue));
        });

        document.querySelector('.js-calculate').addEventListener('click', calculateResult);
        document.querySelector('.js-backspace').addEventListener('click', removeLastEntry);
        document.querySelector('.js-clear').addEventListener('click', clearCalculation);

        document.addEventListener('keydown', (event) => {
            if (event.target instanceof HTMLButtonElement) {
                return;
            }

            if (/^[0-9.]$/.test(event.key)) {
                updateCalculation(event.key);
            } else if (/^[+\-*/]$/.test(event.key)) {
                updateCalculation(` ${event.key} `);
            } else if (event.key === 'Enter' || event.key === '=') {
                event.preventDefault();
                calculateResult();
            } else if (event.key === 'Backspace') {
                removeLastEntry();
            } else if (event.key === 'Escape') {
                clearCalculation();
            } else {
                return;
            }

            event.preventDefault();
        });
    </script>
</body>
</html>
