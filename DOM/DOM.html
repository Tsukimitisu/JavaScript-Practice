<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <p>Youtube Subscribed Button</p>
   <button type="button" onclick="subscribe()" class="js-subBtn" aria-pressed="false">Subscribe</button>

   <h2>Amazon Shipping Calculator</h2>
    <label for="order-cost">Cost of order</label>
    <input id="order-cost" type="number" min="0" step="0.01" onkeydown="handleKeyDown(event)" class="js-CostInput" placeholder="Cost of order">
    <button onclick="
    CalculateTotal()
    " class="js-CalculateBtn">Calculate</button>
    <p class="js-result" role="status" aria-live="polite"></p>
</body>

<script>
    const subscriptionStorageKey = 'youtube-subscription';
    let isSubscribed = localStorage.getItem(subscriptionStorageKey) === 'true';

    renderSubscription();

    function handleKeyDown(event){
        if(event.key === 'Enter'){
                CalculateTotal()
            }
    }
function CalculateTotal(){
    const input = document.querySelector('.js-CostInput');
    const result = document.querySelector('.js-result');
    const cost = Number(input.value);

    if (input.value.trim() === '' || !Number.isFinite(cost) || cost < 0) {
        result.textContent = 'Enter a valid order cost.';
        return;
    }

    const total = cost < 40 ? cost + 10 : cost;
    result.textContent = `The total cost is: $${total.toFixed(2)}`;
}

    function subscribe(){
        isSubscribed = !isSubscribed;
        localStorage.setItem(subscriptionStorageKey, String(isSubscribed));
        renderSubscription();
    }

    function renderSubscription() {
        const button = document.querySelector('.js-subBtn');
        button.textContent = isSubscribed ? 'Subscribed' : 'Subscribe';
        button.setAttribute('aria-pressed', String(isSubscribed));
    }
</script>
</html>
