<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <main>
        <h1>Todo List</h1>
        <form class="js-todo-form">
            <label for="todo-name">Todo name</label>
            <input type="text" id="todo-name" placeholder="Todo name" class="js-input" required>
            <button type="submit">Add</button>
        </form>
        <p class="js-todo-summary" aria-live="polite">0 tasks remaining</p>
        <button type="button" class="js-clear-completed">Clear completed</button>
        <ul class="js-todo-list" aria-live="polite"></ul>
    </main>
    <script src="todo-list.js"></script>
</body>
</html>
