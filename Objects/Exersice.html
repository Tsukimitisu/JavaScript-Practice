<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Exercises</title>
</head>
<body>
    <main>
        <h1>Object Exercises</h1>
        <h2>Products</h2>
        <ul class="js-product-list"></ul>
        <h2>Comparisons</h2>
        <p class="js-price-comparison"></p>
        <p class="js-product-match"></p>
        <h2>String Methods</h2>
        <p class="js-string-results"></p>
    </main>

    <script>
        const product1 = {
            name: 'Basketball',
            price: 2095
        };

        const product2 = {
            name: 'Wallet',
            price: 100
        };

        const product3 = {
            name: 'Basketball',
            price: 2095
        };

        function comparePrice(firstProduct, secondProduct) {
            if (firstProduct.price === secondProduct.price) {
                return `${firstProduct.name} and ${secondProduct.name} have the same price.`;
            }

            const lessExpensiveProduct = firstProduct.price < secondProduct.price
                ? firstProduct
                : secondProduct;

            return `The less expensive product is ${lessExpensiveProduct.name}.`;
        }

        function isSameProduct(firstProduct, secondProduct) {
            return firstProduct.name === secondProduct.name &&
                firstProduct.price === secondProduct.price;
        }

        function formatPrice(priceInCents) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(priceInCents / 100);
        }

        const productList = document.querySelector('.js-product-list');
        [product1, product2, product3].forEach((product) => {
            const item = document.createElement('li');
            item.textContent = `${product.name}: ${formatPrice(product.price)}`;
            productList.append(item);
        });

        document.querySelector('.js-price-comparison').textContent =
            comparePrice(product1, product2);
        document.querySelector('.js-product-match').textContent =
            `Product 1 and Product 3 match: ${isSameProduct(product1, product3) ? 'Yes' : 'No'}.`;
        document.querySelector('.js-string-results').textContent =
            `Lowercase: ${'Good Morning'.toLowerCase()}. Repeated text: ${'test'.repeat(2)}.`;
    </script>
</body>
</html>
