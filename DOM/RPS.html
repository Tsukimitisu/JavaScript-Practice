<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
   <h1>Rock Paper Scissors</h1>
    <button type="button" class="js-move-button" data-move="Rock" aria-keyshortcuts="1">Rock</button>
    <button type="button" class="js-move-button" data-move="Paper" aria-keyshortcuts="2">Paper</button>
    <button type="button" class="js-move-button" data-move="Scissors" aria-keyshortcuts="3">Scissors</button>
    <p>Keyboard shortcuts: 1 for rock, 2 for paper, 3 for scissors, and R to reset.</p>
    <p class="js-result" role="status"></p>
    <p class="js-moves" aria-live="polite"></p>
    <p class="js-score"></p>
    <p class="js-stats"></p>

    <button type="button" class="js-reset-button" aria-keyshortcuts="R">Reset Score</button>
</body>

<script src="../shared/rps-game.js"></script>
<script>
    const storageKey = 'dom-rps-score';
    let score = loadScore();

    updateScoreElement();

    document.querySelectorAll('.js-move-button').forEach((button) => {
        button.addEventListener('click', () => playGame(button.dataset.move));
    });

    document.querySelector('.js-reset-button').addEventListener('click', resetScore);

    document.addEventListener('keydown', (event) => {
        if (event.repeat) {
            return;
        }

        const keyboardMoves = {
            1: 'Rock',
            2: 'Paper',
            3: 'Scissors'
        };
        const move = keyboardMoves[event.key];

        if (move) {
            playGame(move);
        } else if (event.key.toLowerCase() === 'r') {
            resetScore();
        } else {
            return;
        }

        event.preventDefault();
    });

    function loadScore() {
        try {
            const savedScore = JSON.parse(localStorage.getItem(storageKey));
            const values = [savedScore?.wins, savedScore?.losses, savedScore?.tie];

            if (values.every((value) => Number.isInteger(value) && value >= 0)) {
                return savedScore;
            }
        } catch {
            // Ignore invalid saved data and start with a clean score.
        }

        return { wins: 0, losses: 0, tie: 0 };
    }

    function playGame(playersMove){
        const computersMove = RPSGame.getComputerMove();
        const result = RPSGame.getResult(playersMove, computersMove);

        if(result === 'You Win!'){
            score.wins += 1;
        }else if(result === 'You Lose!'){
            score.losses += 1;
        }else if(result === 'Tie'){
            score.tie += 1;
        }

        updateScoreElement();

        localStorage.setItem(storageKey, JSON.stringify(score));
        document.querySelector('.js-moves').textContent =
            `You chose ${playersMove}. The computer chose ${computersMove}.`;
        document.querySelector('.js-result').textContent = result;

  
    }

    function updateScoreElement(){
        const totalRounds = score.wins + score.losses + score.tie;
        const winRate = totalRounds === 0
            ? 0
            : Math.round((score.wins / totalRounds) * 100);

         document.querySelector('.js-score').textContent =
            `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.tie}`;
         document.querySelector('.js-stats').textContent =
            `Rounds played: ${totalRounds}. Win rate: ${winRate}%.`;
    }

    function resetScore() {
        score.wins = 0;
        score.losses = 0;
        score.tie = 0;
        localStorage.removeItem(storageKey);
        updateScoreElement();
        document.querySelector('.js-result').textContent = '';
        document.querySelector('.js-moves').textContent = '';
    }

    
</script>
</html>
