<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <h1>Function Exercises</h1>
        <h2>Calculator</h2>
        <output class="js-calculation" aria-live="polite">0</output>
        <p>
      <button onclick="
        updateCalculation('1');
      ">1</button>

      <button onclick="
        updateCalculation('2');
      ">2</button>

      <button onclick="
        updateCalculation('3');
      ">3</button>

      <button onclick="
        updateCalculation(' + ');
      ">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      ">4</button>

      <button onclick="
        updateCalculation('5');
      ">5</button>

      <button onclick="
        updateCalculation('6');
      ">6</button>

      <button onclick="
        updateCalculation(' - ');
      ">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      ">7</button>

      <button onclick="
        updateCalculation('8');
      ">8</button>

      <button onclick="
        updateCalculation('9');
      ">9</button>

      <button onclick="
        updateCalculation(' * ');
      ">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      ">0</button>

      <button onclick="
        updateCalculation('.');
      ">.</button>

      <button onclick="
        calculateResult();
      ">=</button>

      <button onclick="
        updateCalculation(' / ');
      ">/</button>
    </p>

    <p>
      <button onclick="
        clearCalculation();
      ">Clear</button>
    </p>

    <section>
      <h2>Temperature Converter</h2>
      <form class="js-temperature-form">
        <label for="temperature-value">Temperature</label>
        <input id="temperature-value" class="js-temperature-value" type="number" step="any" required>
        <label for="temperature-unit">Convert from</label>
        <select id="temperature-unit" class="js-temperature-unit">
          <option value="C">Celsius</option>
          <option value="F">Fahrenheit</option>
        </select>
        <button type="submit">Convert</button>
      </form>
      <output class="js-temperature-result" aria-live="polite"></output>
    </section>
 

</body>
<script>
    function greet(){
        console.log('Hello There!');
    }
    greet();

    function greetUser(name){
        console.log(`Hello There! ${name}`)
    }
    greetUser('James');
    function convertToFahrenheit(celsius){
        const fahrenheit = (celsius * 9 / 5) + 32;
        return `${fahrenheit}F`;
    }

    console.log(convertToFahrenheit(25));
 
    function convertToCelsius(fahrenheit){
        const celsius = (fahrenheit - 32) * 5 / 9;
        return `${celsius}C`;
    }

    console.log(convertToCelsius(86));

    function convertTemperature(degrees, unit){
        if(unit === 'C'){
            return convertToFahrenheit(degrees);
        }else if (unit === 'F'){
            return convertToCelsius(degrees);
        }

        return 'Please choose C for Celsius or F for Fahrenheit.';
    }

    console.log(convertTemperature(25, 'C'));

    function convertLength(length, from, to){
        const validUnits = ['miles', 'km', 'ft'];

        if (!validUnits.includes(from)) {
            return `Invalid unit: ${from}`;
        }

        if (!validUnits.includes(to)) {
            return `Invalid unit: ${to}`;
        }

        if (from === to) {
            return `${length} ${to}`;
        }

        const lengthInKm = from === 'km'
            ? length
            : from === 'miles'
                ? length * 1.6
                : length / 3281;

        const result = to === 'km'
            ? lengthInKm
            : to === 'miles'
                ? lengthInKm / 1.6
                : lengthInKm * 3281;

        return `${result} ${to}`;
    }
    console.log(convertLength(50, 'miles', 'km'));
    console.log(convertLength(32, 'km', 'miles'));
    console.log(convertLength(5, 'miles', 'ft'));
    console.log(convertLength(5, 'lbs', 'lbs'));

    let calculation = '';

    function updateCalculation(value) {
        calculation += value;
        displayCalculation();
    }

    function calculateResult() {
        if (!calculation) {
            return;
        }

        try {
            calculation = String(evaluateCalculation(calculation));
            displayCalculation();
        } catch {
            calculation = '';
            displayCalculation('Invalid calculation');
        }
    }

    function evaluateCalculation(expression) {
        const tokens = expression.trim().split(/\s+/);

        if (tokens.length % 2 === 0 || !tokens.every((token, index) =>
            index % 2 === 0 ? /^(?:\d+\.?\d*|\.\d+)$/.test(token) : /^[+\-*/]$/.test(token)
        )) {
            throw new Error('Invalid expression');
        }

        const values = [Number(tokens[0])];
        const operators = [];

        for (let index = 1; index < tokens.length; index += 2) {
            const operator = tokens[index];
            const rightValue = Number(tokens[index + 1]);

            if (operator === '*' || operator === '/') {
                const leftValue = values.pop();
                if (operator === '/' && rightValue === 0) {
                    throw new Error('Cannot divide by zero');
                }
                values.push(operator === '*' ? leftValue * rightValue : leftValue / rightValue);
            } else {
                operators.push(operator);
                values.push(rightValue);
            }
        }

        return operators.reduce((result, operator, index) =>
            operator === '+' ? result + values[index + 1] : result - values[index + 1], values[0]);
    }

    function clearCalculation() {
        calculation = '';
        displayCalculation();
    }

    function displayCalculation(value = calculation || '0') {
        document.querySelector('.js-calculation').textContent = value;
    }

    const temperatureForm = document.querySelector('.js-temperature-form');
    const temperatureValue = document.querySelector('.js-temperature-value');
    const temperatureUnit = document.querySelector('.js-temperature-unit');
    const temperatureResult = document.querySelector('.js-temperature-result');

    temperatureForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const degrees = Number(temperatureValue.value);

        if (!Number.isFinite(degrees)) {
            temperatureResult.textContent = 'Enter a valid temperature.';
            return;
        }

        temperatureResult.textContent = convertTemperature(degrees, temperatureUnit.value);
    });

</script>
</html>
