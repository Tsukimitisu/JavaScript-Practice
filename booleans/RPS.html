<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <button type="button" onclick="playGame('Rock')">Rock</button>
    <button type="button" onclick="playGame('Paper')">Paper</button>
    <button type="button" onclick="playGame('Scissors')">Scissors</button>
    <p class="js-moves" aria-live="polite"></p>
    <p class="js-result" role="status"></p>
    <p class="js-score"></p>
    <p class="js-win-rate"></p>
    <button type="button" onclick="resetScore()">Reset Score</button>
</body>

<script>
    const storageKey = 'boolean-rps-score';
    let score = loadScore();

    updateScore();

    function loadScore() {
        try {
            const savedScore = JSON.parse(localStorage.getItem(storageKey));
            const values = [savedScore?.wins, savedScore?.losses, savedScore?.ties];

            if (values.every((value) => Number.isInteger(value) && value >= 0)) {
                return savedScore;
            }
        } catch {
            // Start fresh when the stored score is not valid JSON.
        }

        return { wins: 0, losses: 0, ties: 0 };
    }

    function getComputerMove() {
        const randomNumber = Math.random();

        if (randomNumber < 1 / 3) {
            return 'Rock';
        }

        if (randomNumber < 2 / 3) {
            return 'Paper';
        }

        return 'Scissors';
    }

    function getResult(playerMove, computerMove) {
        if (playerMove === computerMove) {
            return 'Tie';
        }

        if (
            (playerMove === 'Rock' && computerMove === 'Scissors') ||
            (playerMove === 'Paper' && computerMove === 'Rock') ||
            (playerMove === 'Scissors' && computerMove === 'Paper')
        ) {
            return 'You Win!';
        }

        return 'You Lose!';
    }

    function playGame(playerMove) {
        const computerMove = getComputerMove();
        const result = getResult(playerMove, computerMove);

        if (result === 'You Win!') {
            score.wins += 1;
        } else if (result === 'You Lose!') {
            score.losses += 1;
        } else {
            score.ties += 1;
        }

        localStorage.setItem(storageKey, JSON.stringify(score));

        document.querySelector('.js-moves').textContent =
            `You chose ${playerMove}. The computer chose ${computerMove}.`;
        document.querySelector('.js-result').textContent = result;
        updateScore();
    }

    function updateScore() {
        const totalRounds = score.wins + score.losses + score.ties;
        const winRate = totalRounds === 0
            ? 0
            : Math.round((score.wins / totalRounds) * 100);

        document.querySelector('.js-score').textContent =
            `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
        document.querySelector('.js-win-rate').textContent =
            `Rounds played: ${totalRounds}. Win rate: ${winRate}%.`;
    }

    function resetScore() {
        score = { wins: 0, losses: 0, ties: 0 };
        localStorage.removeItem(storageKey);
        document.querySelector('.js-moves').textContent = '';
        document.querySelector('.js-result').textContent = '';
        updateScore();
    }

</script>
</html>
