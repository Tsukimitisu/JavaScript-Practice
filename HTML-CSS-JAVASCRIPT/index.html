<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Exercises</title>
</head>
<style>
       body{
        font-family: Arial, Helvetica, sans-serif;
    }

    .subscribe-btn{
        border: none;
        background-color: black;
        color: white;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 50px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 30px;
    }

    .is-subscribed{
        background-color: rgb(240, 240, 240);
        color: black;
    }

    .cost-input{
        font-size: 15px;
        padding: 10px;
    
        
    }
    
    .calculate-btn{
        background-color: green;
        border: none;
        font-size: 15px;
        padding: 13px 15px;
        color: white;
        cursor: pointer;
    }
 

</style>
<body>
   <p>Youtube Subscribed Button</p>
   <button type="button" onclick="
  subscribe()
   " class="js-subBtn  subscribe-btn">Subscribe</button>

   <p>Amazon Shipping Calculator</p>
    <label for="order-cost">Cost of order</label>
    <input type="number" id="order-cost" min="0" step="0.01" onkeydown="handleKeyDown(event)" class="js-CostInput cost-input" placeholder="0.00">
    <button type="button" onclick="
    calculateTotal()
    " class="js-CalculateBtn calculate-btn">Calculate</button>
    <p class="js-result" role="status" aria-live="polite"></p>
</body>

<script>
    function handleKeyDown(event){
        if(event.key === 'Enter'){
                calculateTotal()
            }
    }
function calculateTotal(){
    const input = document.querySelector('.js-CostInput');
    const result = document.querySelector('.js-result');
    const inputValue = input.value.trim();
    const cost = Number(inputValue);

    if (!inputValue || !Number.isFinite(cost) || cost < 0) {
        result.textContent = 'Enter an order cost of $0 or more.';
        input.focus();
        return;
    }

    const total = cost < 40 ? cost + 10 : cost;
    result.textContent = `The total cost is: $${total.toFixed(2)}`;
}

    function subscribe(){
         const button = document.querySelector('.js-subBtn')

   if(button.textContent === 'Subscribe'){
    button.textContent = 'Subscribed'
    button.classList.add('is-subscribed')
   }else{
    button.textContent = 'Subscribe'
    button.classList.remove('is-subscribed')
   }
    }
</script>
</html>
