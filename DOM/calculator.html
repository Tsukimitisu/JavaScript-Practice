<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Calculator</title>
  </head>
  <body>
    <p class="result" role="status" aria-live="polite">0</p>
    <p>
      <button onclick="
        updateCalculation('1');
      ">1</button>

      <button onclick="
        updateCalculation('2');
      ">2</button>

      <button onclick="
        updateCalculation('3');
      ">3</button>

      <button onclick="
        updateCalculation(' + ');
      ">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      ">4</button>

      <button onclick="
        updateCalculation('5');
      ">5</button>

      <button onclick="
        updateCalculation('6');
      ">6</button>

      <button onclick="
        updateCalculation(' - ');
      ">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      ">7</button>

      <button onclick="
        updateCalculation('8');
      ">8</button>

      <button onclick="
        updateCalculation('9');
      ">9</button>

      <button onclick="
        updateCalculation(' * ');
      ">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      ">0</button>

      <button onclick="
        updateCalculation('.');
      ">.</button>

      <button onclick="
        calculateResult();
      ">=</button>

      <button onclick="
        updateCalculation(' / ');
      ">/</button>
    </p>

    <p>
      <button onclick="
        clearCalculation();
      ">Clear</button>
    </p>

    <script>
      const storageKey = 'dom-calculator-value';
      let calculation = localStorage.getItem(storageKey) || '';

      displayResult();

      function updateCalculation(value) {
        calculation += value;
        localStorage.setItem(storageKey, calculation);
        displayResult();
      }

      function calculateResult() {
        if (!calculation) {
          return;
        }

        try {
          calculation = String(eval(calculation));
          localStorage.setItem(storageKey, calculation);
          displayResult();
        } catch {
          calculation = '';
          localStorage.removeItem(storageKey);
          displayResult('Invalid calculation');
        }
      }

      function clearCalculation() {
        calculation = '';
        localStorage.removeItem(storageKey);
        displayResult();
      }

      function displayResult(value = calculation || '0') {
        const result = document.querySelector('.result');
        result.textContent = value;
      }
     
    </script>
  </body>
</html>
