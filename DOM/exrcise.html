<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Manipulation Exercise</title>
</head>
<body>
    <button>9a</button>
    <button class="js-btn">9b</button>
    <br>
    <br>
    <hr>
    <br>
    <button class="js-HeadBtn" onclick="buttonClick('heads')">Heads</button>
    <button class="js-TailsBtn" onclick="buttonClick('tails')">Tails</button>
    <p class="js-display" aria-live="polite"></p>
    <br>
    <hr>

    <label for="name-input">Your name</label>
    <input id="name-input" type="text" name="name" class="js-NameInput" placeholder="Enter your name" onkeydown="
    handleKey(event)
    " >
    <button onclick="
    displayNames()
    ">Submit</button>
    <p class="js-NameDisplay" aria-live="polite"></p>

    <hr>
    <label for="live-input">Live preview</label>
    <input id="live-input" type="text" class="js-keyUp" onkeyup="handlesKeyUp()">
    <p class="js-displaykeyUp" aria-live="polite"></p>
</body>

<script>
    console.log(document.querySelector('button'))
    document.querySelector('.js-btn').innerText =  '9B Done'

    const display = document.querySelector('.js-display')
    function buttonClick(button){
        if(button === 'heads'){
            display.textContent = 'You choose: Heads'
        }else if(button === 'tails'){
            display.textContent = 'You choose: Tails'
        }
    }

   
    function displayNames(){
        const displayName = document.querySelector('.js-NameDisplay')
        const nameInput = document.querySelector('.js-NameInput')
        const name = nameInput.value.trim()

        displayName.textContent = name
            ? `Your name is: ${name}`
            : 'Please enter your name.'
    }
    function handleKey(event){
        if(event.key === 'Enter'){
            displayNames()
        }
    }


    function handlesKeyUp(){
        const getName = document.querySelector('.js-keyUp')
        const keyUpDisplay = document.querySelector('.js-displaykeyUp')
        keyUpDisplay.textContent = getName.value
    }

    

</script>
</html>
