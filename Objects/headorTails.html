<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heads or Tails</title>
  </head>
  <body>
    <h1>Heads or Tails Game</h1>
        <button type="button" onclick="
        playGame('heads')
        ">Heads</button>
        <button type="button" onclick="
        playGame('tails')
        ">Tails</button>
        <button type="button" onclick="resetScore()">Reset Score</button>
        <p class="js-result" aria-live="polite"></p>
        <p class="js-score"></p>

    <script>
        const storageKey = 'heads-tails-score';
        let score = loadScore();

        updateScore();

        function loadScore() {
            try {
                const savedScore = JSON.parse(localStorage.getItem(storageKey));

                if (
                    Number.isInteger(savedScore?.wins) && savedScore.wins >= 0 &&
                    Number.isInteger(savedScore?.losses) && savedScore.losses >= 0
                ) {
                    return savedScore;
                }
            } catch {
                // Ignore invalid saved data and start with a clean score.
            }

            return { wins: 0, losses: 0 };
        }

        function playGame(guess){
            const randomNumber = Math.random();
            const result = randomNumber < 0.5 ? 'heads' : 'tails';
            const finalResult = guess === result ? 'You win!' : 'You lose!';

            if(finalResult === 'You win!'){
                score.wins += 1;
            }else{
                score.losses += 1;
            }

            localStorage.setItem(storageKey, JSON.stringify(score));
            document.querySelector('.js-result').textContent =
                `The coin landed on ${result}. ${finalResult}`;
            updateScore();
        }

        function updateScore() {
            document.querySelector('.js-score').textContent =
                `Wins: ${score.wins}, Losses: ${score.losses}`;
        }

        function resetScore() {
            score = { wins: 0, losses: 0 };
            localStorage.removeItem(storageKey);
            document.querySelector('.js-result').textContent = '';
            updateScore();
        }

   </script>
  </body>
</html>
