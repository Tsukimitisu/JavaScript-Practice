<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS and JavaScript Exercises</title>
    <style>
        .addCart-btn{
            color: black;
            background-color: rgb(255, 216, 20);
            border: none;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
            padding: 8px 60px;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 50px;
        }
           .calculate-btn{
        background-color: green;
        border: none;
        font-size: 15px;
        padding: 13px 15px;
        color: white;
        cursor: pointer;
    }

        .uber-btn{
            background-color: black;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            margin-right: 30px;
            cursor: pointer;
        }

        .is-clicked{
            background-color: rgb(230, 230, 230);
            border: none;
            color: black;
        }

        .js-button{
            background-color: green;
            border: none;
            padding: 15px 40px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            font-size: 15px;
            color: white;
            border-radius: 50px;
            cursor: pointer;

        }

        .hobby-btn{
            padding: 10px 15px;
           
            background-color: rgb(230, 230, 230);
             color: black;
            font-size: 15px;
            border-radius: 10px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            border: none;
        }

        .is-toggled{
             background-color: black;
             color: white;          
            border: none;
        }

        .cost-input{
        font-size: 15px;
        padding: 10px;
    
        
    }

    .error{
        color: red;
    }

    </style>

</head>

<body>
    <button type="button" class="addCart-btn">Add to Cart</button>
    <br>
    <button type="button" class="js-uberBtn uber-btn">Request now</button>

    <button type="button" class="js-button">Test</button>
    <p class="js-test-result" role="status" aria-live="polite"></p>
<br>
<br>
<br>
    <button type="button" class="hobby-btn" data-hobby="Gaming" aria-pressed="false">Gaming</button>
    <button type="button" class="hobby-btn" data-hobby="Music" aria-pressed="false">Music</button>
    <button type="button" class="hobby-btn" data-hobby="Tech" aria-pressed="false">Tech</button>
<br>
<br>
    <h2>Amazon Shipping Calculator</h2>
    <form class="js-shipping-form">
        <label for="exercise-order-cost">Cost of order</label>
        <input id="exercise-order-cost" type="number" min="0" step="0.01" class="js-CostInput cost-input" placeholder="Cost of Order" required>
        <button type="submit" class="js-CalculateBtn calculate-btn">Calculate</button>
    </form>
    <p class="js-result" role="status" aria-live="polite"></p>
  
</body>

<script>
    const uberButton = document.querySelector('.js-uberBtn');
    const testButton = document.querySelector('.js-button');
    const shippingForm = document.querySelector('.js-shipping-form');

    uberButton.addEventListener('click', getUberBtn);
    testButton.addEventListener('click', test);
    shippingForm.addEventListener('submit', (event) => {
        event.preventDefault();
        calculateTotal();
    });

    document.querySelectorAll('[data-hobby]').forEach((button) => {
        button.addEventListener('click', () => toggle(button));
    });

    function getUberBtn(){
    if(uberButton.textContent === 'Request now'){
        uberButton.textContent = 'Schedule for later'
        uberButton.classList.add('is-clicked')
    }else{
        uberButton.textContent = 'Request now'
        uberButton.classList.remove('is-clicked')
    }
}

function test(){
    const hasExpectedClass = testButton.classList.contains('js-button');
    document.querySelector('.js-test-result').textContent = hasExpectedClass
        ? 'The test button has the expected class.'
        : 'The expected class is missing.';

}

function toggle(button){
    if(!button.classList.contains('is-toggled')){
        removeToggle()
        button.classList.add('is-toggled')
        button.setAttribute('aria-pressed', 'true');

    }else{
        button.classList.remove('is-toggled')
        button.setAttribute('aria-pressed', 'false');
    }
}

function removeToggle(){
    const prev = document.querySelector('.is-toggled')

    if(prev){
        prev.classList.remove('is-toggled')
        prev.setAttribute('aria-pressed', 'false');
    }
}

function calculateTotal(){
   const input = document.querySelector('.js-CostInput')
    const result = document.querySelector('.js-result')
    const inputValue = input.value.trim();
    const cost = Number(inputValue);
 
    if(!inputValue || !Number.isFinite(cost) || cost < 0){
        result.textContent = 'Enter an order cost of $0 or more.';
        result.classList.add('error');
        input.focus();
        return;
    }

    result.classList.remove('error');

    const shippingCost = cost < 40 ? 10 : 0;
    const total = cost + shippingCost;
    const shippingLabel = shippingCost === 0 ? 'Free' : `$${shippingCost.toFixed(2)}`;
    result.textContent =
        `Subtotal: $${cost.toFixed(2)}. Shipping: ${shippingLabel}. Total: $${total.toFixed(2)}.`;

}
    
</script>



</html>
