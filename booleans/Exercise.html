<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>
<body>
    <p>Cart Quantity</p>
    <p class="js-cart-status" role="status" aria-live="polite">Cart Quantity: 0 / 10</p>
    <button type="button" class="js-show-cart">Show Quantity</button>
    <button type="button" data-cart-amount="1">Add to Cart</button>
    <button type="button" data-cart-amount="2">+2</button>
    <button type="button" data-cart-amount="3">+3</button>
    <button type="button" data-cart-amount="4">+4</button>
    <button type="button" data-cart-amount="-1">-1</button>
    <button type="button" class="js-checkout">Checkout</button>
    <button type="button" class="js-reset-cart">Reset Cart</button>
</body>
<script>
    const maxCartQuantity = 10;
    const storageKey = 'boolean-cart-quantity';
    const savedQuantity = Number.parseInt(localStorage.getItem(storageKey), 10);
    let cartQuantity = Number.isInteger(savedQuantity) &&
        savedQuantity >= 0 && savedQuantity <= maxCartQuantity
        ? savedQuantity
        : 0;
    const cartStatusElement = document.querySelector('.js-cart-status');
    const checkoutButton = document.querySelector('.js-checkout');

    showQuantity();

    function showQuantity(message = '') {
        cartStatusElement.textContent = message ||
            `Cart Quantity: ${cartQuantity} / ${maxCartQuantity}`;
        checkoutButton.disabled = cartQuantity === 0;
        console.log(`Cart Quantity: ${cartQuantity} / ${maxCartQuantity}`);
    }

    function addToCart(amount) {
        if (cartQuantity >= maxCartQuantity) {
            showQuantity('The cart is already full.');
            return;
        }

        if (cartQuantity + amount > maxCartQuantity) {
            cartQuantity = maxCartQuantity;
        } else {
            cartQuantity += amount;
        }

        localStorage.setItem(storageKey, String(cartQuantity));
        showQuantity();
    }

    function removeFromCart(amount) {
        if (cartQuantity === 0) {
            showQuantity('The cart is already empty.');
            return;
        }

        cartQuantity -= amount;

        if (cartQuantity < 0) {
            cartQuantity = 0;
        }

        localStorage.setItem(storageKey, String(cartQuantity));
        showQuantity();
    }

    function resetCart() {
        cartQuantity = 0;
        localStorage.removeItem(storageKey);
        console.log('Cart Was Reset');
        showQuantity('Cart reset. Cart Quantity: 0 / 10');
    }

    function checkout() {
        if (cartQuantity === 0) {
            showQuantity('Add an item before checking out.');
            return;
        }

        const purchasedQuantity = cartQuantity;
        cartQuantity = 0;
        localStorage.removeItem(storageKey);
        showQuantity(`Checked out ${purchasedQuantity} ${purchasedQuantity === 1 ? 'item' : 'items'}.`);
    }

    document.querySelector('.js-show-cart').addEventListener('click', () => {
        showQuantity();
    });

    document.querySelectorAll('[data-cart-amount]').forEach((button) => {
        button.addEventListener('click', () => {
            const amount = Number(button.dataset.cartAmount);

            if (amount > 0) {
                addToCart(amount);
            } else {
                removeFromCart(Math.abs(amount));
            }
        });
    });

    checkoutButton.addEventListener('click', checkout);
    document.querySelector('.js-reset-cart').addEventListener('click', resetCart);



</script>
</html>
