<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Exercises</title>
</head>
<body>
        <h1>Function Exercises</h1>
        <h2>Calculator</h2>
        <output class="js-calculation" aria-live="polite">0</output>
        <p>
      <button type="button" data-calculator-value="1">1</button>

      <button type="button" data-calculator-value="2">2</button>

      <button type="button" data-calculator-value="3">3</button>

      <button type="button" data-calculator-value=" + ">+</button>
    </p>

    <p>
      <button type="button" data-calculator-value="4">4</button>

      <button type="button" data-calculator-value="5">5</button>

      <button type="button" data-calculator-value="6">6</button>

      <button type="button" data-calculator-value=" - ">-</button>
    </p>

    <p>
      <button type="button" data-calculator-value="7">7</button>

      <button type="button" data-calculator-value="8">8</button>

      <button type="button" data-calculator-value="9">9</button>

      <button type="button" data-calculator-value=" * ">*</button>
    </p>

    <p>
      <button type="button" data-calculator-value="0">0</button>

      <button type="button" data-calculator-value=".">.</button>

      <button type="button" class="js-calculate">=</button>

      <button type="button" data-calculator-value=" / ">/</button>
    </p>

    <p>
      <button type="button" class="js-toggle-sign">+/-</button>
      <button type="button" class="js-clear">Clear</button>
    </p>

    <section>
      <h2>Temperature Converter</h2>
      <form class="js-temperature-form">
        <label for="temperature-value">Temperature</label>
        <input id="temperature-value" class="js-temperature-value" type="number" step="any" required>
        <label for="temperature-unit">Convert from</label>
        <select id="temperature-unit" class="js-temperature-unit">
          <option value="C">Celsius</option>
          <option value="F">Fahrenheit</option>
        </select>
        <button type="submit">Convert</button>
      </form>
      <output class="js-temperature-result" aria-live="polite"></output>
    </section>

    <section>
      <h2>Length Converter</h2>
      <form class="js-length-form">
        <label for="length-value">Length</label>
        <input id="length-value" class="js-length-value" type="number" min="0" step="any" required>
        <label for="length-from">From</label>
        <select id="length-from" class="js-length-from">
          <option value="miles">Miles</option>
          <option value="km">Kilometers</option>
          <option value="ft">Feet</option>
        </select>
        <label for="length-to">To</label>
        <select id="length-to" class="js-length-to">
          <option value="km">Kilometers</option>
          <option value="miles">Miles</option>
          <option value="ft">Feet</option>
        </select>
        <button type="submit">Convert</button>
      </form>
      <output class="js-length-result" aria-live="polite"></output>
    </section>
 

</body>
<script src="../shared/calculator-math.js"></script>
<script>
    function greet(){
        console.log('Hello There!');
    }
    greet();

    function greetUser(name){
        console.log(`Hello There! ${name}`)
    }
    greetUser('James');
    function convertToFahrenheit(celsius){
        const fahrenheit = (celsius * 9 / 5) + 32;
        return `${fahrenheit}F`;
    }

    console.log(convertToFahrenheit(25));
 
    function convertToCelsius(fahrenheit){
        const celsius = (fahrenheit - 32) * 5 / 9;
        return `${celsius}C`;
    }

    console.log(convertToCelsius(86));

    function convertTemperature(degrees, unit){
        if(unit === 'C'){
            return convertToFahrenheit(degrees);
        }else if (unit === 'F'){
            return convertToCelsius(degrees);
        }

        return 'Please choose C for Celsius or F for Fahrenheit.';
    }

    console.log(convertTemperature(25, 'C'));

    function convertLength(length, from, to){
        const validUnits = ['miles', 'km', 'ft'];

        if (!validUnits.includes(from)) {
            return `Invalid unit: ${from}`;
        }

        if (!validUnits.includes(to)) {
            return `Invalid unit: ${to}`;
        }

        if (from === to) {
            return `${length} ${to}`;
        }

        const lengthInKm = from === 'km'
            ? length
            : from === 'miles'
                ? length * 1.6
                : length / 3281;

        const result = to === 'km'
            ? lengthInKm
            : to === 'miles'
                ? lengthInKm / 1.6
                : lengthInKm * 3281;

        return `${result} ${to}`;
    }
    console.log(convertLength(50, 'miles', 'km'));
    console.log(convertLength(32, 'km', 'miles'));
    console.log(convertLength(5, 'miles', 'ft'));
    console.log(convertLength(5, 'lbs', 'lbs'));

    let calculation = '';

    function updateCalculation(value) {
        calculation = CalculatorMath.appendToken(calculation, value);
        displayCalculation();
    }

    function calculateResult() {
        if (!calculation) {
            return;
        }

        try {
            calculation = String(CalculatorMath.evaluate(calculation));
            displayCalculation();
        } catch (error) {
            calculation = '';
            displayCalculation(error.message);
        }
    }

    function clearCalculation() {
        calculation = '';
        displayCalculation();
    }

    function displayCalculation(value = calculation || '0') {
        document.querySelector('.js-calculation').textContent = value;
    }

    document.querySelectorAll('[data-calculator-value]').forEach((button) => {
        button.addEventListener('click', () => updateCalculation(button.dataset.calculatorValue));
    });

    document.querySelector('.js-calculate').addEventListener('click', calculateResult);
    document.querySelector('.js-toggle-sign').addEventListener('click', () => {
        calculation = CalculatorMath.toggleSign(calculation);
        displayCalculation();
    });
    document.querySelector('.js-clear').addEventListener('click', clearCalculation);

    const temperatureForm = document.querySelector('.js-temperature-form');
    const temperatureValue = document.querySelector('.js-temperature-value');
    const temperatureUnit = document.querySelector('.js-temperature-unit');
    const temperatureResult = document.querySelector('.js-temperature-result');

    temperatureForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const degrees = Number(temperatureValue.value);

        if (!Number.isFinite(degrees)) {
            temperatureResult.textContent = 'Enter a valid temperature.';
            return;
        }

        temperatureResult.textContent = convertTemperature(degrees, temperatureUnit.value);
    });

    const lengthForm = document.querySelector('.js-length-form');
    const lengthValue = document.querySelector('.js-length-value');
    const lengthFrom = document.querySelector('.js-length-from');
    const lengthTo = document.querySelector('.js-length-to');
    const lengthResult = document.querySelector('.js-length-result');

    lengthForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const length = Number(lengthValue.value);

        if (!Number.isFinite(length) || length < 0) {
            lengthResult.textContent = 'Enter a valid non-negative length.';
            return;
        }

        lengthResult.textContent = convertLength(length, lengthFrom.value, lengthTo.value);
    });

</script>
</html>
